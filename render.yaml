# Two services and three cron jobs.
#
# The split is not decoration. The API service is the only thing holding a
# Stripe secret, the only thing verifying webhook signatures, and the only
# thing running the background jobs. The web service renders pages. If the
# frontend is compromised tomorrow, nobody can charge a card with it.
#
# Both read the same database, and both build from the same repo, because the
# domain lives in packages/core and is shared rather than duplicated.
#
# Deploy with: render blueprint launch, or point Render at this file.
# Every secret below is marked sync: false, so Render asks rather than storing
# anything in git. Nothing here is a value; they are all names.

services:
  # ---------------------------------------------------------------- the API
  - type: web
    name: keiki-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "3001"
      # The catalogue endpoints put this into every registerUrl they return, so
      # it has to be the address families actually see.
      - key: PUBLIC_SITE_URL
        value: https://www.keikicoders.com
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Only this service ever holds these.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_TRANSPORT
        value: resend
      - key: EMAIL_FROM
        value: Keiki Coders <hello@keikicoders.com>

  # ---------------------------------------------------------------- the site
  - type: web
    name: keiki-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_AUTH
        value: "false"
      - key: API_URL
        fromService:
          type: web
          name: keiki-api
          property: hostport

# ---------------------------------------------------------------------------
# The jobs.
#
# These run the same functions the CLI runs, so "it worked when I ran it" and
# "it works on the schedule" are statements about one piece of code. Times are
# UTC; Hawaii is UTC-10 and has no daylight saving, which is the one nice thing
# about scheduling anything there.
# ---------------------------------------------------------------------------
  - type: cron
    name: keiki-reminders
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    # 17:00 UTC is 7am in Honolulu: before the school run, on the morning of
    # the class. Every reminder carries a dedupe key, so running twice is a
    # no-op rather than a second email.
    schedule: "0 17 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter api job:reminders
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: keiki-notify
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    # Every five minutes. The outbox is written inside the transaction that
    # caused the message, so this is delivery, not decision making, and a late
    # run costs a delay rather than a lost email.
    schedule: "*/5 * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter api job:notify
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_TRANSPORT
        value: resend
      - key: EMAIL_FROM
        value: Keiki Coders <hello@keikicoders.com>

  - type: cron
    name: keiki-sweep-holds
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    # Every minute. A seat held by somebody who opened Stripe and wandered off
    # is a seat another family could have had, and holds are only thirty
    # minutes long, so a slow sweep is a real cost.
    schedule: "* * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter api job:sweep
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
